version: 2

models:
  - name: dim_shippers
    description: "Dimension table containing unique shippers. Join with fact_loadsmart using shipper_key."
    columns:
      - name: shipper_key
        description: "Primary key for the shipper. Used to join with fact_loadsmart.shipper_key."
        tests:
          - unique
          - not_null
      - name: shipper_name
        description: "The name of the shipper company."
        tests:
          - not_null

  - name: dim_carriers
    description: "Dimension table containing unique carriers. Join with fact_loadsmart using carrier_key."
    columns:
      - name: carrier_key
        description: "Primary key for the carrier. Used to join with fact_loadsmart.carrier_key."
        tests:
          - unique
          - not_null
      - name: carrier_name
        description: "The name of the carrier company."

  - name: dim_lanes
    description: "Dimension table that contains unique routes (lanes). Join with fact_loadsmart using lane_key."
    columns:
      - name: lane_key
        description: "Primary key for the lane. Used to join with fact_loadsmart.lane_key."
        tests:
          - unique
          - not_null
      - name: lane
        description: "String representation of the route (e.g., Origin -> Destination)."
      - name: pickup_city
        description: "The city where the load is picked up."
      - name: pickup_state
        description: "The state where the load is picked up."
      - name: delivery_city
        description: "The city where the load is delivered."
      - name: delivery_state
        description: "The state where the load is delivered."

  - name: fact_loadsmart
    description: >
      A historical Fact table containing cargo, financial, and operational metrics.
    columns:
      - name: loadsmart_id
        description: "Cargo primary key and main identifier. Count this to get the total number of loads."
        tests:
          - unique
          - not_null
      - name: shipper_key
        description: "Foreign key linking to dim_shippers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_shippers')
              field: shipper_key
      - name: carrier_key
        description: "Foreign key linking to dim_carriers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_carriers')
              field: carrier_key
      - name: lane_key
        description: "Foreign key linking to dim_lanes."
        tests:
          - not_null
          - relationships:
              to: ref('dim_lanes')
              field: lane_key
      - name: pickup_city
        description: "The city where the load was picked up."
      - name: pickup_state
        description: "The 2-letter state abbreviation where the load originated. If comparing intrastate vs interstate, compare this column to delivery_state."
      - name: delivery_city
        description: "The city where the load was delivered."
      - name: delivery_state
        description: "The 2-letter state abbreviation where the load was delivered. Use this to filter destinations (e.g., loads into Texas = 'TX')."
      - name: quote_date
        description: "The timestamp when a price quote was first given to the shipper."
      - name: book_date
        description: "The timestamp when the load was booked (the shipper accepted the quote)."
      - name: source_date
        description: "The timestamp when a carrier was sourced/assigned to move the load."
      - name: pickup_date
        description: "The scheduled/actual pickup timestamp."
      - name: delivery_date
        description: >
          The timestamp when the load was actually delivered.
          Use this for all volume and monthly delivery calculations.
          This is historical data, do not use CURRENT_DATE.
          Only if a question explicitly asks about the "last month" or
          "last full month", filter delivery_date >= DATE '2024-12-01' AND
          delivery_date < DATE '2025-01-01' (that is the last full month in
          this data). Do not apply this date filter for any other question.
      - name: load_was_cancelled
        description: "Boolean flag (TRUE/FALSE). If a question asks for 'delivered loads' or successful loads, you must filter WHERE load_was_cancelled = FALSE. This applies together with any delivery_date filter, not instead of it."
      - name: book_price
        description: "The total price charged to the shipper for the load. Sum this for 'total book price' and average it for 'average book price'."
        tests:
          - not_null
      - name: source_price
        description: "The cost paid to the carrier to move the load."
      - name: pnl
        description: "Operation profit or loss metric (book_price minus source_price)."
      - name: mileage
        description: "Distance of the load in miles. A small number of rows have mileage of 0, which is not realistic for a truckload move - a known data quality issue in the raw file, not filtered out here."
      - name: equipment_type
        description: "Trailer/equipment type used for the load. One of: DRV (dry van), RFR (refrigerated/reefer), FBE (flatbed). Never null."
      - name: carrier_rating
        description: "Rating (0-5) given to the carrier for this load. Sparse: about 86% of rows are null, so aggregations over this column cover a minority of loads only."
      - name: sourcing_channel
        description: "Channel through which the carrier was sourced for this load. Sparse: about 95% of rows are null."
      - name: vip_carrier
        description: "Boolean flag: TRUE if the carrier is designated a VIP carrier. True for a small minority of loads (~2.5%)."
      - name: carrier_dropped_us_count
        description: "Number of times this carrier has dropped (backed out of) a load with Loadsmart, as of this record. 0 for the vast majority of loads."
      - name: carrier_on_time_to_pickup
        description: "Boolean flag: TRUE if the carrier arrived on time for pickup. Null when on-time tracking wasn't recorded for the load (common for cancelled loads)."
      - name: carrier_on_time_to_delivery
        description: "Boolean flag: TRUE if the carrier delivered on time. Null when on-time tracking wasn't recorded for the load (common for cancelled loads)."
      - name: carrier_on_time_overall
        description: "Boolean flag: TRUE if the carrier was on time overall (pickup and delivery). Null when on-time tracking wasn't recorded for the load (common for cancelled loads)."
      - name: pickup_appointment_time
        description: "Scheduled pickup appointment timestamp."
      - name: delivery_appointment_time
        description: "Scheduled delivery appointment timestamp."
      - name: has_mobile_app_tracking
        description: "Boolean flag: whether the load was tracked via the carrier's mobile app. Always FALSE in this dataset, no rows use mobile app tracking."
      - name: has_macropoint_tracking
        description: "Boolean flag: whether the load was tracked via MacroPoint. Always FALSE in this dataset."
      - name: has_edi_tracking
        description: "Boolean flag: whether the load was tracked via EDI. Always FALSE in this dataset."
      - name: contracted_load
        description: "Boolean flag: whether the load was moved under a contracted (as opposed to spot) agreement. Always FALSE in this dataset."
      - name: load_booked_autonomously
        description: "Boolean flag: whether the load was booked automatically by Loadsmart's system rather than by a human."
      - name: load_sourced_autonomously
        description: "Boolean flag: whether the carrier for the load was sourced automatically by Loadsmart's system rather than by a human."